Resources:
  RawAwid3Bucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: ${self:custom.rawBucketName}
      # Publica en EventBridge los eventos del bucket ("Object Created" en landing/batch/ inicia
      # el workflow de ingesta batch de Glue). No reemplaza el bucket ni toca sus datos.
      NotificationConfiguration:
        EventBridgeConfiguration:
          EventBridgeEnabled: true
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true

  QuarantineAwid3Bucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: ${self:custom.quarantineBucketName}
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  TrustedAwid3Bucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: ${self:custom.trustedBucketName}
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
