service: nexasecure-cicd
provider:
  name: aws
  region: ${opt:region, 'us-east-1'}
  stage: ${opt:stage, 'dev'}
  stackName: nexasecure-cicd-${self:provider.stage}
custom:
  developerName: ${env:GIT_USER_NAME, 'local'}
  rawBucketName: nexasecure-wids-awid3-raw-${self:provider.stage}-${self:custom.developerName}
  alertFormatterName: nexasecure-alerts-${self:provider.stage}-alertFormatter
  roleName: nexasecure-github-actions-${self:provider.stage}
  # Los repositorios de GitHub que pueden asumir el rol se definen en iam.js
  # (variable de entorno GITHUB_REPOS, owner/repo separados por coma).
  # Solo puede existir un proveedor OIDC de GitHub por cuenta. Si ya existe, usar 'false'.
  createOidcProvider: ${env:CREATE_OIDC_PROVIDER, 'true'}
resources:
  - ${file(iam.js)}
