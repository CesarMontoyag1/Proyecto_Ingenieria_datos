Resources:
  BatchIngestJob:
    Type: AWS::Glue::Job
    Properties:
      Name: nexasecure_batch_ingest_${self:provider.stage}_${self:custom.developerName}
      Role: !GetAtt GlueServiceRole.Arn
      GlueVersion: "4.0"
      Command:
        Name: glueetl
        ScriptLocation: !Sub "s3://${self:custom.scriptsBucketName}/glue-jobs/batch_ingest_job.py"
      DefaultArguments:
        "--datalake-formats": "iceberg"
        "--RAW_BUCKET_NAME": ${ssm:/nexasecure/${self:provider.stage}/storage/RawAwid3BucketName}
        "--TRUSTED_BUCKET_NAME": ${ssm:/nexasecure/${self:provider.stage}/storage/TrustedAwid3BucketName}
        "--QUARANTINE_BUCKET_NAME": ${ssm:/nexasecure/${self:provider.stage}/storage/QuarantineAwid3BucketName}
        "--HMAC_SECRET_NAME": "/nexasecure/${self:provider.stage}/PiiHmacKey"
        "--CATALOG_DATABASE_NAME": !Ref NexaSecureWidsCatalog
        "--job-bookmark-option": "job-bookmark-enable"
        "--conf": "spark.sql.extensions=org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions --conf spark.sql.catalog.glue_catalog=org.apache.iceberg.spark.SparkCatalog --conf spark.sql.catalog.glue_catalog.catalog-impl=org.apache.iceberg.aws.glue.GlueCatalog --conf spark.sql.catalog.glue_catalog.io-impl=org.apache.iceberg.aws.s3.S3FileIO"
      WorkerType: "G.1X"
      NumberOfWorkers: 2
      Timeout: 60

  IcebergMaintenanceJob:
    Type: AWS::Glue::Job
    Properties:
      Name: nexasecure_iceberg_maintenance_${self:provider.stage}_${self:custom.developerName}
      Role: !GetAtt GlueServiceRole.Arn
      GlueVersion: "4.0"
      Command:
        Name: glueetl
        ScriptLocation: !Sub "s3://${self:custom.scriptsBucketName}/glue-jobs/compaction_job.py"
      DefaultArguments:
        "--datalake-formats": "iceberg"
        "--TRUSTED_BUCKET_NAME": ${ssm:/nexasecure/${self:provider.stage}/storage/TrustedAwid3BucketName}
        "--CATALOG_DATABASE_NAME": !Ref NexaSecureWidsCatalog
        "--conf": "spark.sql.extensions=org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions --conf spark.sql.catalog.glue_catalog=org.apache.iceberg.spark.SparkCatalog --conf spark.sql.catalog.glue_catalog.catalog-impl=org.apache.iceberg.aws.glue.GlueCatalog --conf spark.sql.catalog.glue_catalog.io-impl=org.apache.iceberg.aws.s3.S3FileIO"
      WorkerType: "G.1X"
      NumberOfWorkers: 2
      Timeout: 60

