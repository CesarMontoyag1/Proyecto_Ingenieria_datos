Resources:
  GlueServiceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: glue.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSGlueServiceRole
        - arn:aws:iam::aws:policy/AWSGlueConsoleFullAccess
      Policies:
        - PolicyName: GlueS3AccessPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:ListBucket
                  - s3:DeleteObject
                Resource:
                  - ${ssm:/nexasecure/${self:provider.stage}/storage/RawAwid3BucketArn}
                  - !Sub "${ssm:/nexasecure/${self:provider.stage}/storage/RawAwid3BucketArn}/*"
                  - ${ssm:/nexasecure/${self:provider.stage}/storage/TrustedAwid3BucketArn}
                  - !Sub "${ssm:/nexasecure/${self:provider.stage}/storage/TrustedAwid3BucketArn}/*"
                  - ${ssm:/nexasecure/${self:provider.stage}/storage/QuarantineAwid3BucketArn}
                  - !Sub "${ssm:/nexasecure/${self:provider.stage}/storage/QuarantineAwid3BucketArn}/*"
        - PolicyName: GlueSecretsAccessPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource:
                  - arn:aws:secretsmanager:${self:provider.region}:*:secret:/nexasecure/${self:provider.stage}/PiiHmacKey-*

