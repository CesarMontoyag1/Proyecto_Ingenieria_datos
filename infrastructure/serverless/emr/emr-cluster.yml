Resources:
  DetectionEmrCluster:
    Type: AWS::EMR::Cluster
    Properties:
      Name: nexasecure-flink-cluster-${self:provider.stage}
      ReleaseLabel: emr-6.15.0
      Applications:
        - Name: Hadoop
        - Name: Flink
      Instances:
        MasterInstanceGroup:
          InstanceCount: 1
          InstanceType: ${env:EMR_INSTANCE_TYPE, 'm5.xlarge'}
          Name: MasterNode
        CoreInstanceGroup:
          InstanceCount: 1
          InstanceType: ${env:EMR_INSTANCE_TYPE, 'm5.xlarge'}
          Name: CoreNode
        TerminationProtected: false
      AutoTerminationPolicy:
        IdleTimeout: 1800 # 30 minutos de inactividad antes de auto-terminar para proteger créditos
      # Roles estándar de Amazon EMR (con fallback configurable para Learner Lab vía env)
      JobFlowRole: ${env:EMR_JOB_FLOW_ROLE, 'EMR_EC2_DefaultRole'}
      ServiceRole: ${env:EMR_SERVICE_ROLE, 'EMR_DefaultRole'}
      VisibleToAllUsers: true
      BootstrapActions:
        - Name: InstallPyFlinkAndDependencies
          ScriptBootstrapAction:
            Path: !Sub "s3://${ssm:/nexasecure/${self:provider.stage}/storage/RawAwid3BucketName}/bootstrap/emr-bootstrap.sh"
      Steps:
        - Name: NexaSecureDetectionJob
          ActionOnFailure: CONTINUE
          HadoopJarStep:
            Jar: command-runner.jar
            Args:
              - bash
              - -c
              - !Sub "export AWS_DEFAULT_REGION=us-east-1 AWS_REGION=us-east-1 STAGE=${self:provider.stage} PYTHONPATH=/home/hadoop/flink-app:$PYTHONPATH && aws s3 cp s3://${ssm:/nexasecure/${self:provider.stage}/storage/RawAwid3BucketName}/flink-app/ /home/hadoop/flink-app/ --recursive && cd /home/hadoop/flink-app && python3 -u -m src.detection_job"

  ClusterIdParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /nexasecure/${self:provider.stage}/emr/ClusterId
      Type: String
      Value: !Ref DetectionEmrCluster
      Description: ID del cluster Amazon EMR para deteccion Flink

  StepNameParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /nexasecure/${self:provider.stage}/emr/StepName
      Type: String
      Value: NexaSecureFlinkDetectionStep
      Description: Nombre del Step de ejecucion Flink en EMR
