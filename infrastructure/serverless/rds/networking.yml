Resources:
  DatabaseSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: NexaSecure PostgreSQL subnets
      SubnetIds: ${self:custom.deployment.subnetIds}

  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      # Immutable description: keep stable across network-rule changes.
      GroupDescription: PostgreSQL from EMR and the migration workstation only
      VpcId: ${self:custom.deployment.vpcId}
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: ${self:custom.deployment.emrMasterSecurityGroupId}
          Description: Current EMR Python consumer on master node
      SecurityGroupEgress:
        - IpProtocol: '-1'
          CidrIp: 127.0.0.1/32
          Description: No initiated external connections; responses are stateful
