Resources:
  PiiHmacKeySecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: /nexasecure/${self:provider.stage}/PiiHmacKey
      Description: Clave HMAC-SHA256 para la seudonimización de direcciones MAC (OUI) en Flink
      GenerateSecretString:
        SecretStringTemplate: '{"key": "REPLACE_WITH_SECURE_RANDOM_KEY"}'
        GenerateStringKey: "hmac_key"
        PasswordLength: 64
        ExcludeCharacters: '"@/\'

